name: CI
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-vendor:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@main
    with:
      concurrency-suffix: vendor
      test-command: |
        nimble test

  build-searchpath:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@main
    with:
      concurrency-suffix: searchpath
      test-command: |
        rm -rf vendor
        nimble test

  build-asan:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@main
    with:
      concurrency-suffix: asan
      test-command: |
        nimble test_asan

  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
          - os: macos
        hashtree:
          - vendor
          - searchpath
        include:
          - target:
              os: linux
            builder: ubuntu-latest
          - target:
              os: macos
            builder: macos-latest

    name: '${{ matrix.target.os }} Fuzz (hashtree_abi via ${{ matrix.hashtree }})'
    runs-on: ${{ matrix.builder }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install fuzzing engines (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          # libFuzzer
          sudo apt-get install -y clang

          # honggfuzz
          nimble install -y testutils
          "$(nimble path testutils | head -1)/scripts/install_honggfuzz.sh"
          echo "/opt/honggfuzz/usr/local/bin" >> "$GITHUB_PATH"

          # afl
          sudo apt-get install -y afl++
          sudo afl-system-config

      - name: Install fuzzing engines (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update

          # libFuzzer
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"

          # honggfuzz
          nimble install -y testutils
          "$(nimble path testutils | head -1)/scripts/install_honggfuzz.sh"
          echo "/opt/honggfuzz/usr/local/bin" >> "$GITHUB_PATH"

          # afl
          brew install afl++
          sudo afl-system-config

      - name: Remove vendor directory
        if: matrix.hashtree == 'searchpath'
        run: rm -rf vendor

      - name: Run fuzzing tests
        run: nimble fuzzHashtree
